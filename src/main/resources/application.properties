spring.application.name=ai-workshop
spring.ai.openai.api-key=${OPENAI_API_KEY}
spring.ai.openai.chat.options.model=gpt-4o
spring.threads.virtual.enabled=true

spring.ai.ollama.chat.model=bespokeai/minicheck
spring.ai.ollama.chat.temperature=0.1

logging.level.dev.danvega.workshop=DEBUG

# Model router demo (router package). The Jev starter reads TYPESAFE_API_KEY.
router.fallback=gpt-5.4
router.confidence-threshold=0.65
router.models[0].id=gpt-5.4-nano
router.models[0].name=GPT-5.4 nano
router.models[0].tier=economy
router.models[0].description=Simple factual questions, classification, extraction, short summaries, and straightforward rewrites.
router.models[1].id=gpt-5.4-mini
router.models[1].name=GPT-5.4 mini
router.models[1].tier=balanced
router.models[1].description=Everyday coding, debugging with clear scope, nuanced writing, and analysis.
router.models[2].id=gpt-5.4
router.models[2].name=GPT-5.4
router.models[2].tier=premium
router.models[2].description=Difficult multi-step reasoning, subtle bugs, mathematical analysis, and complex design tradeoffs.